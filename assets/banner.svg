<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0)}50%{transform:translateY(-15px)}}@keyframes dashWave{0%{stroke-dashoffset:1000}}@keyframes pillPulse{0%{transform:scale(1)}50%{transform:scale(1.03)}}.bg{fill:url(#bgGradient)}.grid{fill:url(#grid)}.glowing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.glowing-orb-2{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:1000px 300px}.floating-card{animation:floatParticle 4s ease-in-out infinite}.floating-card-delayed{animation:floatParticle 5s ease-in-out infinite 2s}.wave-line{stroke-dasharray:10 15;animation:dashWave 30s linear infinite}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8;letter-spacing:.5px}.badge-text{font-weight:600;font-size:13px;fill:#fff}</style><rect width="1200" height="400" class="bg" rx="16"/><rect width="1200" height="400" class="grid" rx="16"/><circle cx="200" cy="100" r="180" fill="#6366f1" class="glowing-orb-1" filter="blur(60px)" opacity=".25"/><circle cx="1000" cy="300" r="220" fill="#ec4899" class="glowing-orb-2" filter="blur(70px)" opacity=".2"/><circle cx="600" cy="200" r="150" fill="#06b6d4" filter="blur(50px)" opacity=".15"/><path fill="none" stroke="url(#cyanGlow)" stroke-width="3" d="M 50 320 Q 300 240, 600 310 T 1150 220" class="wave-line" opacity=".4"/><path fill="none" stroke="url(#primaryGlow)" stroke-width="3" d="M 50 280 Q 350 350, 700 250 T 1150 290" class="wave-line" opacity=".5"/><g class="floating-card" opacity=".85"><rect width="260" height="65" x="860" y="70" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12"/><circle cx="890" cy="102" r="14" fill="#10b981" fill-opacity=".2"/><path fill="none" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 884 102 L 888 106 L 896 98"/><text x="915" y="97" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Variant B (Winner)</text><text x="915" y="117" fill="#10b981" font-family="system-ui" font-size="16" font-weight="700">+18.4% Conversion</text></g><g class="floating-card-delayed" opacity=".85"><rect width="240" height="65" x="80" y="270" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12"/><circle cx="110" cy="302" r="14" fill="#6366f1" fill-opacity=".2"/><text x="105" y="307" fill="#818cf8" font-family="system-ui" font-size="14" font-weight="800">p</text><text x="135" y="297" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Statistical Significance</text><text x="135" y="317" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="700">p &lt; 0.001 (CUPED)</text></g><g><g transform="translate(80, 130)"><rect width="270" height="32" x="0" y="0" fill="url(#primaryGlow)" opacity=".95" rx="16"/><text x="135" y="21" class="badge-text" text-anchor="middle">🧪 DECISION SCIENCE &amp; TESTING</text></g><text x="0" y="85" class="title" transform="translate(80, 130)">Awesome Experimentation Platform</text><text x="0" y="125" class="subtitle" transform="translate(80, 130)">Curated Ecosystem for A/B Testing, Feature Flags &amp; Warehouse-Native Stats</text></g><rect width="1040" height="4" x="80" y="348" fill="url(#primaryGlow)" rx="2"/></svg>